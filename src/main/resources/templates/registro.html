<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Mueblería Ofimarck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --ofimarck-primary: #1e3a8a;
            --ofimarck-secondary: #0f172a;
            --ofimarck-accent: #d97706;
        }

        body {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 520px;
            padding: 2.5rem 2rem;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.15);
        }

        .brand-box {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-box i {
            font-size: 2.5rem;
            color: var(--ofimarck-accent);
        }

        .brand-box h5 {
            color: var(--ofimarck-primary);
            font-weight: 800;
            margin-top: 0.5rem;
        }

        .brand-box p {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0;
        }

        .btn-register {
            background: var(--ofimarck-primary);
            border: none;
            font-weight: 600;
            padding: 0.75rem;
        }

        .btn-register:hover {
            background: #174299;
        }

        .alert-msg {
            border-radius: 0.5rem;
        }

        .alert-success-msg {
            border-radius: 0.5rem;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-box">
            <i class="bi bi-person-plus-fill"></i>
            <h5>Crear Cuenta</h5>
            <p>Únase a Mueblería Ofimarck</p>
        </div>

        <div th:if="${exito}" class="alert alert-success-msg" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${exito}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-msg" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/registro}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Nombres <span class="text-danger">*</span></label>
                    <input type="text" name="nombres" class="form-control" th:value="${registroRequest.nombres}"
                        required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Apellidos <span class="text-danger">*</span></label>
                    <input type="text" name="apellidos" class="form-control" th:value="${registroRequest.apellidos}"
                        required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Correo electrónico <span class="text-danger">*</span></label>
                    <input type="email" name="correo" class="form-control" th:value="${registroRequest.correo}"
                        placeholder="correo@ejemplo.com" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Teléfono</label>
                    <input type="tel" name="telefono" class="form-control" th:value="${registroRequest.telefono}"
                        placeholder="999 888 777">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Contraseña <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres"
                        required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Confirmar contraseña <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" placeholder="Repita su contraseña" required>
                </div>
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-register btn-primary w-100">
                    <i class="bi bi-person-plus me-2"></i>Crear cuenta
                </button>
            </div>
        </form>

        <div class="mt-4 text-center">
            <small class="text-muted">¿Ya tiene cuenta? <a href="/login" class="text-decoration-none fw-bold"
                    style="color: var(--ofimarck-primary);">Iniciar sesión</a></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
