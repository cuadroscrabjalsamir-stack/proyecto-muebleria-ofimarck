<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — Mueblería Ofimarck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .card-img-top { height: 220px; object-fit: cover; }
        .precio { font-weight: 700; color: #198754; font-size: 1.25rem; }
        .stock-bajo { color: #dc3545; }
        .stock-ok { color: #198754; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-chair"></i> Mueblería Ofimarck</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/catalogo">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="/nosotros">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="/contacto">Contacto</a></li>
                <li class="nav-item"><a class="nav-link" href="/login">Iniciar sesión</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 pt-4">
    <section class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Catálogo de productos</h2>
            <div>
                <input type="text" id="buscador" class="form-control form-control-sm d-inline-block w-auto" placeholder="Buscar producto..." style="width:260px;">
            </div>
        </div>
        <div class="row g-4" id="gridCatalogo">
            <div class="col-12 text-center text-muted py-4">Cargando productos...</div>
        </div>
    </section>
</div>

<footer class="bg-dark text-white py-4">
    <div class="container text-center"><p class="mb-0">Mueblería Ofimarck — Fábrica propia · Diseño a medida · Entrega coordinada</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const grid = document.getElementById('gridCatalogo');
    const buscador = document.getElementById('buscador');
    let productos = [];

    function render(filtro) {
        const q = (filtro || '').toLowerCase();
        const lista = productos.filter(p => p.estado && (!q || (p.nombre || '').toLowerCase().includes(q) || (p.sku || '').toLowerCase().includes(q)));
        if (lista.length === 0) {
            grid.innerHTML = '<div class="col-12 text-center text-muted py-4">No se encontraron productos.</div>';
            return;
        }
        grid.innerHTML = lista.map(p => `
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm">
                    ${p.urlImagen ? `<img src="${p.urlImagen}" class="card-img-top" alt="${p.nombre}">` : `<div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height:220px;"><i class="bi bi-box text-muted" style="font-size:3rem;"></i></div>`}
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">${p.nombre}</h5>
                        <p class="card-text small text-muted">${p.categoriaNombre || ''} · ${p.sku}</p>
                        <p class="card-text small">${(p.descripcion || '').substring(0, 90)}${(p.descripcion||'').length > 90 ? '...' : ''}</p>
                        <div class="mt-auto">
                            <div class="precio">S/ ${Number(p.precio || 0).toLocaleString('es-PE')}</div>
                            <span class="badge ${(p.stock||0) <= 0 ? 'stock-bajo' : 'stock-ok'}">
                                ${(p.stock||0) <= 0 ? 'Agotado' : 'Stock: ' + p.stock}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    fetch('/api/productos')
        .then(r => r.ok ? r.json() : Promise.reject('Error al cargar productos'))
        .then(data => { productos = data; render(); })
        .catch(err => { grid.innerHTML = '<div class="col-12 text-center text-danger py-4">No se pudieron cargar los productos.</div>'; });

    buscador.addEventListener('input', () => render(buscador.value));
</script>
</body>
</html>
