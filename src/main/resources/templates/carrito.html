<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Carrito de Compras - Mueblería Ofimarck</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/catalogo}">Mueblería Ofimarck</a>
        <div class="d-flex">
            <a th:href="@{/catalogo}" class="btn btn-outline-light me-2">📦 Catálogo</a>
            <a th:href="@{/login}" class="btn btn-light">Iniciar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>🛒 Carrito de Compras</h2>

    <div th:if="${carrito.items == null or carrito.items.empty}" class="alert alert-warning">
        Tu carrito está vacío.
        <a th:href="@{/catalogo}" class="alert-link">Ir al catálogo</a>
    </div>

    <div th:if="${carrito.items != null and not #lists.isEmpty(carrito.items)}}">
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Producto</th>
                    <th>SKU</th>
                    <th>Precio Unitario</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${carrito.items}">
                    <td th:text="${item.nombre}">Producto</td>
                    <td class="text-muted" th:text="${item.sku}">SKU</td>
                    <td th:text="|S/ ${item.precioUnitario}|">Precio</td>
                    <td>
                        <input type="number" class="form-control form-control-sm" min="1"
                               th:value="${item.cantidad}" th:attr="data-id=${item.idProducto}"/>
                    </td>
                    <td class="fw-bold" th:text="|S/ ${item.subtotal}|">Subtotal</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger"
                                th:attr="data-id=${item.idProducto}">Eliminar</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div>
                <span class="fw-semibold">Total ítems: </span>
                <span th:text="${carrito.totalItems}">0</span>
            </div>
            <div>
                <span class="fw-semibold">Total a pagar: </span>
                <span class="fs-5 text-primary" th:text="|S/ ${carrito.total}|">0.00</span>
            </div>
        </div>

        <div th:if="${nombreUsuario != null}" class="mt-3">
            <span class="text-muted">Usuario: </span>
            <span th:text="${nombreUsuario}">Usuario</span>
        </div>

        <div class="mt-4">
            <a th:href="@{/api/pedidos}" class="btn btn-success btn-lg">Proceder al pago</a>
            <a th:href="@{/catalogo}" class="btn btn-outline-secondary ms-2">Seguir comprando</a>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    // Manejo simple de eliminación de ítems del carrito (llama al endpoint REST /api/carrito/items/{id})
    document.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', function () {
            const id = this.getAttribute('data-id');
            fetch(`/api/carrito/items/${id}`, { method: 'DELETE' })
                .then(() => location.reload());
        });
    });
</script>
</body>
</html>
