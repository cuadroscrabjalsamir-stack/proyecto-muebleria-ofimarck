<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Mueblería Ofimarck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --ofimarck-primary: #1e3a8a;
            --ofimarck-secondary: #0f172a;
            --ofimarck-accent: #d97706;
        }
        body {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.15);
        }
        .brand-box {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-box i {
            font-size: 2.5rem;
            color: var(--ofimarck-accent);
        }
        .brand-box h5 {
            color: var(--ofimarck-primary);
            font-weight: 800;
            margin-top: 0.5rem;
        }
        .brand-box p {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0;
        }
        .btn-login {
            background: var(--ofimarck-primary);
            border: none;
            font-weight: 600;
            padding: 0.75rem;
        }
        .btn-login:hover {
            background: #174299;
        }
        .alert-msg {
            border-radius: 0.5rem;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 0.875rem;
            margin: 1.25rem 0;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider:not(:empty)::before {
            margin-right: 0.75rem;
        }
        .divider:not(:empty)::after {
            margin-left: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-box">
            <i class="bi bi-box-seam-fill"></i>
            <h5>Mueblería Ofimarck</h5>
            <p>Sistema Web de Comercio Electrónico</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-msg" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label fw-bold">Correo electrónico</label>
                <input type="email" name="correo" class="form-control" placeholder="correo@ejemplo.com"
                       th:value="${correo}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-login btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                </button>
            </div>
        </form>

        <div class="divider">o continuar</div>

        <div class="d-grid">
            <a href="/registro" class="btn btn-outline-secondary w-100">
                <i class="bi bi-person-plus me-2"></i>Crear cuenta
            </a>
        </div>

        <div class="mt-3 text-center">
            <small class="text-muted">¿Eres administrador? <a href="/admin" class="text-decoration-none fw-bold" style="color: var(--ofimarck-primary);">Ir al panel de administración</a></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
